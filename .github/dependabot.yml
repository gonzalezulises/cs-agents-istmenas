version: 2

# Este repo no tenia .github/dependabot.yml, asi que solo recibia actualizaciones de
# seguridad: una por vulnerabilidad, sin agrupar y sin nada que las cerrara.
#
# El manifiesto npm vive en /ui, no en la raiz.
#
# `applies-to: security-updates` las colapsa en un PR por tanda. El `cooldown` no sirve
# aqui: por diseno de GitHub no aplica a las actualizaciones de seguridad.
#
# `open-pull-requests-limit: 0` apaga las actualizaciones de *version* y deja pasar las de
# seguridad. Es deliberado: este repo no tiene un check requerido que construya el
# proyecto, asi que un bump no tendria quien lo verifique y la cola volveria a llenarse.
#
# No hay entrada `github-actions`: el repo no tiene .github/workflows y Dependabot aborta
# el job con "/action.yml or /.github/workflows/<anything>.yml not found".
updates:
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
